x-app: &app
  build:
    context: .
  image: finance-web:local
  environment: &app-env
    DJANGO_SETTINGS_MODULE: setup.settings
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    EMBEDDING_MODELS: ${EMBEDDING_MODELS:-paraphrase-multilingual-MiniLM-L12-v2}
    EXPERIMENT_CACHE_ENABLED: ${EXPERIMENT_CACHE_ENABLED:-0}
    COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-300}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
    EXPERIMENT_BATCH_SIZE: ${EXPERIMENT_BATCH_SIZE:-16}
    HF_HOME: /app/data/hf
    FASE1_SQLITE_PATH: /app/data/cache/fase1.sqlite
    PIPELINE_METRICS_PATH: /app/data/metrics/pipeline_metrics.jsonl
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - app_logs:/app/logs
    - app_data:/app/data
    - hf_cache:/app/data/hf
    - ./exports:/app/exports
    - ./core/intelligent_motor/models:/app/core/intelligent_motor/models:ro
    - ./rss.txt:/app/rss.txt:ro
    - ./core_ativos.json:/app/core_ativos.json:ro
  restart: unless-stopped
  init: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/migrate.log
    depends_on:
      db:
        condition: service_healthy

  # Migração única do corpus legado. Use:
  #   docker compose --profile tools run --rm migrate-data
  migrate-data:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command:
      - sh
      - -c
      - "test -f /src/db.sqlite3 || { echo 'ERRO: ./db.sqlite3 nao encontrado na raiz do projeto.'; echo 'Copie o arquivo do corpus para a raiz e rode de novo.'; exit 1; }; python manage.py migrate_sqlite_to_postgres --source /src/db.sqlite3"
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/migrate-data.log
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data
      - hf_cache:/app/data/hf
      - ./exports:/app/exports
      - ./core/intelligent_motor/models:/app/core/intelligent_motor/models:ro
      - ./rss.txt:/app/rss.txt:ro
      - ./core_ativos.json:/app/core_ativos.json:ro
      # Monta a raiz do projeto read-only em /src. É um diretório que sempre
      # existe, então o Docker não cria um ./db.sqlite3 vazio quando o arquivo
      # do corpus está ausente (o comando acima falha com mensagem clara).
      - ./:/src:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command:
      - gunicorn
      - setup.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-2}
      - --timeout
      - "180"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/web.log
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector:
    <<: *app
    command: ["python", "manage.py", "run_collector"]
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/collector.log
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ["python", "manage.py", "run_experiments"]
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/worker.log
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  # Perfis one-shot: docker compose --profile tools run --rm bootstrap
  bootstrap:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["python", "manage.py", "bootstrap"]
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/bootstrap.log
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  exporter:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command:
      - python
      - manage.py
      - export_dataset
      - --output
      - /app/exports
    environment:
      <<: *app-env
      LOG_FILE_PATH: /app/logs/exporter.log
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  app_logs:
  app_data:
  hf_cache:
